name: macOS package

# Builds the macOS package on a macOS runner (electron-builder cannot build it
# on Windows) and attaches it to the release that was just published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build macOS packages (arm64 and x64, ad-hoc signed)
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check that the app bundle starts
        run: |
          APP="release/mac-arm64/Claude Adds.app/Contents/MacOS/Claude Adds"
          CLAUDE_ADDS_USER_DATA="$RUNNER_TEMP/profile" "$APP" &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then echo "app is running"; kill "$PID"; else echo "app exited early"; exit 1; fi

      - name: Attach to the release
        run: gh release upload "$TAG" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
