name: Release

# Two kinds of release come from here:
#   - a push to develop      -> development build  v<version>-dev.<run>  (pre-release)
#   - a pushed tag v<x.y.z>  -> official release
# The app's "development" update channel follows the first kind, "stable" the second.
on:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          BASE="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "Tag $TAG does not match package.json version $BASE" >&2
              exit 1
            fi
            case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          else
            VERSION="$BASE-dev.$GITHUB_RUN_NUMBER"
            TAG="v$VERSION"
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (prerelease=$PRERELEASE)"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the build version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Package for Windows (installer and portable)
        if: runner.os == 'Windows'
        run: npm run package

      - name: Package for macOS (arm64 and x64, ad-hoc signed)
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: Check that the macOS app starts
        if: runner.os == 'macOS'
        run: |
          APP="release/mac-arm64/Claude Adds.app/Contents/MacOS/Claude Adds"
          CLAUDE_ADDS_USER_DATA="$RUNNER_TEMP/profile" CLAUDE_ADDS_NO_UPDATE_CHECK=1 "$APP" &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then echo "app is running"; kill "$PID"; else echo "app exited early"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Write checksums
        run: |
          cd packages
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Claude Adds $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            "${FLAGS[@]}"
      - name: Keep only the five newest development builds
        if: needs.prepare.outputs.prerelease == 'true'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-dev.")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r OLD; do
                echo "Removing $OLD"
                gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
