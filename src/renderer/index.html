<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Adds</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <nav class="side" aria-label="التنقل الرئيسي">
        <div class="brand">
          <bdi class="brand-name" dir="ltr">Claude Adds</bdi>
          <span class="brand-sub">أدواتك عبر منصات الذكاء الاصطناعي</span>
        </div>
        <ul class="nav" id="nav"></ul>
        <div class="side-foot">
          <div class="app-version" id="app-version"></div>
          <button type="button" class="btn quiet" id="theme-toggle"></button>
        </div>
      </nav>

      <main class="main">
        <div class="envbar" id="envbar" role="group" aria-label="المنصة"></div>

        <header class="top">
          <label class="search">
            <span class="visually-hidden">بحث في كل الأدوات</span>
            <input
              id="search"
              type="search"
              dir="auto"
              autocomplete="off"
              spellcheck="false"
              placeholder="ابحث باسم الأداة أو بالمهمة، بالعربية أو الإنجليزية"
            />
          </label>
          <div class="top-actions">
            <span class="muted" id="checked-at"></span>
            <button type="button" class="btn" id="refresh">تحديث البيانات</button>
            <button type="button" class="btn" id="add-tool">إضافة أداة من رابط Git</button>
          </div>
        </header>

        <div id="banner"></div>

        <section class="view" id="list" aria-label="قائمة الأدوات">
          <div class="list-head">
            <h1 id="list-title"></h1>
            <span class="muted" id="result-count" role="status" aria-live="polite"></span>
          </div>
          <div class="tabs" id="tabs" role="tablist" aria-label="نوع الأداة"></div>
          <div class="summary" id="summary"></div>
          <div class="filters" role="group" aria-label="المرشحات">
            <div class="field-dd"><span class="field-label">الحالة</span><span id="f-status"></span></div>
            <div class="field-dd"><span class="field-label">الفئة</span><span id="f-category"></span></div>
            <div class="field-dd"><span class="field-label">المصدر</span><span id="f-source"></span></div>
            <div class="field-dd"><span class="field-label">النطاق</span><span id="f-scope"></span></div>
            <button type="button" class="btn quiet" id="clear-filters">مسح المرشحات</button>
          </div>
          <div class="table-wrap" id="table-wrap"></div>
        </section>

        <section class="view" id="platforms" aria-label="المنصات والمصادر" hidden></section>
      </main>

      <aside class="details" id="details" aria-label="تفاصيل الأداة" hidden></aside>
      <button type="button" class="panel-toggle" id="panel-toggle"></button>
    </div>

    <dialog class="dialog tool-modal" id="tool-modal" aria-label="تفاصيل الأداة">
      <div class="tool-modal-body" id="tool-modal-body"></div>
    </dialog>

    <dialog class="dialog" id="plan" aria-labelledby="plan-title">
      <h2 id="plan-title">خطة التثبيت</h2>
      <div class="dialog-body" id="plan-body"></div>
      <div class="dialog-actions" id="plan-actions"></div>
    </dialog>

    <dialog class="dialog" id="diag" aria-labelledby="diag-title">
      <h2 id="diag-title">تشخيص وإصلاح</h2>
      <div class="dialog-body" id="diag-body"></div>
      <div class="dialog-actions" id="diag-actions"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
